
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#D91B70" />
  <title>PennyWise — You're Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #F7F7F9;
      color: #25232A;
      text-align: center;
    }

    .card {
      max-width: 380px;
      padding: 36px 28px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    p {
      color: #77717C;
      line-height: 1.6;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 24px;
      margin-top: 16px;
      background: #D91B70;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">📡</div>

    <h1>You're offline!</h1>

    <p>
      PennyWise couldn't connect to the internet.
      Check your connection and try again.
    </p>

    <button onclick="window.location.reload()">
      Try Again
    </button>
  </main>
</body>
</html>
